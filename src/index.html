<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Arcbyte Technologies | Software Development Company</title>
    <meta
      name="description"
      content="Arcbyte Technologies is a software development company crafting scalable web, mobile and cloud solutions for ambitious businesses."
    />
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" type="image/png" href="assets/logo.png" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Sora:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="app-splash" role="status" aria-live="polite" aria-label="Loading Arcbyte Technologies">
      <img src="assets/logo.png" alt="Arcbyte Technologies" />
    </div>
    <app-root></app-root>
    <style>
      #app-splash {
        position: fixed;
        inset: 0;
        z-index: 10000;
        display: grid;
        place-items: center;
        background: #f4f7ff;
        transition:
          opacity 0.45s ease,
          visibility 0.45s ease;
      }

      #app-splash img {
        width: min(220px, 56vw);
        height: auto;
        animation: splash-pop 0.75s cubic-bezier(0.22, 1.25, 0.36, 1) both;
      }

      #app-splash.is-done {
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
      }

      @keyframes splash-pop {
        0% {
          transform: scale(0.5);
          opacity: 0;
        }
        70% {
          transform: scale(1.08);
          opacity: 1;
        }
        100% {
          transform: scale(1);
          opacity: 1;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        #app-splash img {
          animation: none;
        }
      }
    </style>
  </body>
</html>
