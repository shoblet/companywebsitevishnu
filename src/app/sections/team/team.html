<section id="team" class="section team">
  <div class="container">
    <div class="section-head center">
      <span class="eyebrow">Meet the Team</span>
      <h2>The people behind Arcbyte</h2>
      <p>
        A senior, hands-on team of engineers and designers who stay close to the work and
        to our clients.
      </p>
    </div>

    <div class="team__grid">
      @for (member of members; track member.name) {
        <article class="team-card">
          <div class="team-card__avatar" aria-hidden="true">{{ member.initials }}</div>
          <h3>{{ member.name }}</h3>
          <span class="team-card__role">{{ member.role }}</span>
          <p>{{ member.bio }}</p>
        </article>
      }
    </div>
  </div>
</section>
